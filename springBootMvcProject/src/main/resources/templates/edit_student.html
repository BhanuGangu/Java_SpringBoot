<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Edit Student</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Student Management Systems</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
	
    <div class="collapse navbar-collapse" id="navbarSupportedContent">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" th:href="@{/students/new}">New Student</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" aria-current="page" th:href="@{/students}">Student</a>
        </li>
      </ul>
    </div>
  </div>
</nav>
<br /> <br /> <br />
<div class="container row col-md-6 offset-md-3">
    <div class="card">
        <div class="card-header">
            <h1 class="text-center">Edit Student</h1>
        </div>
        <div class="card-body">
            <form th:action="@{/students/{studentId}(studentId=${student.id})}" th:object="${student}" method="post" role="form">
                <div class="form-group mb-3">
                    <label for="firstName">Student First Name</label>
                    <input type="text" class="form-control" id="firstName" placeholder="Enter first name" th:field="*{firstName}" required>
                    <p th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}" class="text-danger"></p>
                </div>
                <div class="form-group mb-3">
                    <label for="lastName">Student Last Name</label>
                    <input type="text" class="form-control" id="lastName" placeholder="Enter last name" th:field="*{lastName}" required>
                    <p th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" class="text-danger"></p>
                </div>
                <div class="form-group mb-3">
                    <label for="email">Student Email</label>
                    <input type="email" class="form-control" id="email" placeholder="Enter email" th:field="*{email}" required>
                    <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger"></p>
                </div>
                <button type="submit" class="btn btn-primary">Create Student</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
